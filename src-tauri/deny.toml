# cargo-deny's policy for the crate's dependency tree, checked by
# scripts/supply-chain.ps1 (and so by .github/workflows/security.yml): known
# advisories, licenses, banned or duplicated crates, and where crates come from.
# The tree is every platform's: a crate only Linux or macOS builds still counts.

[advisories]
# The RustSec advisory database, fetched fresh on every run. A vulnerability, an
# unmaintained or unsound crate fails the check wherever it is in the tree (the
# scopes spelled out: cargo-deny's own default for unsound is the workspace's
# direct dependencies only); a yanked one is a warning, as a yank is often a
# packaging mistake rather than a flaw.
unmaintained = "all"
unsound = "all"
yanked = "warn"
# Each ignore names who still pulls the crate in and why it cannot go yet, and
# ends on "Expires YYYY-MM-DD": scripts/supply-chain.ps1 fails once that date
# has passed, so an ignore is looked at again rather than kept for good.
ignore = [
    # zbus 5 split its name and value types into crates that zbus 6 folds back
    # in. The Linux portal and keyring clients, ashpd and oo7, still use zbus 5.
    # Unmaintained, with no vulnerability reported.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux-only, through zbus 5; no upstream on zbus 6 yet. Expires 2027-02-08" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: Linux-only, through zbus 5; no upstream on zbus 6 yet. Expires 2027-02-08" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: Linux-only, through zbus 5; no upstream on zbus 6 yet. Expires 2027-02-08" },
    # muda and libappindicator still use GTK 0.18 on Linux. The proc macro
    # runs at compile time. Luna never uses VariantStrIter,
    # whose unsound iterator implementations were fixed in glib 0.20.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: Linux-only, compile-time, through gtk-rs 0.18 under muda. Expires 2027-02-08" },
    { id = "RUSTSEC-2024-0429", reason = "glib: Linux-only, through gtk-rs 0.18 under muda; Luna never uses VariantStrIter. Expires 2027-02-08" },
    # Unmaintained, with no vulnerability reported, and pulled in by the GPUI
    # snapshot the native window pins exactly (crates/window/Cargo.toml):
    # nothing moves them short of the next snapshot.
    { id = "RUSTSEC-2024-0384", reason = "instant: pulled in by the gpui-pre 0.3.12 / gpui-component 0.10.0 snapshot, pinned; revisit at the next snapshot upgrade. Expires 2027-02-19" },
    { id = "RUSTSEC-2024-0436", reason = "paste: pulled in by the gpui-pre 0.3.12 / gpui-component 0.10.0 snapshot, pinned; revisit at the next snapshot upgrade. Expires 2027-02-19" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: pulled in by the gpui-pre 0.3.12 / gpui-component 0.10.0 snapshot, pinned; revisit at the next snapshot upgrade. Expires 2027-02-19" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: pulled in by the gpui-pre 0.3.12 / gpui-component 0.10.0 snapshot, pinned; revisit at the next snapshot upgrade. Expires 2027-02-19" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: pulled in by the gpui-pre 0.3.12 / gpui-component 0.10.0 snapshot, pinned; revisit at the next snapshot upgrade. Expires 2027-02-19" },
    # chrono is reached only through gpui-base, gpui-component, gpui-pre and
    # gpui-pre-scheduler; Luna's own code does not depend on it.
    { id = "RUSTSEC-2026-0543", reason = "chrono: pulled in by the gpui-pre 0.3.12 / gpui-component 0.10.0 snapshot, pinned; revisit at the next snapshot upgrade. Expires 2027-02-19" },
]

[licenses]
# What the tree needs to be distributed under the crate's MIT OR Apache-2.0,
# from `cargo deny list`; a crate under anything else fails the check. A license
# expression passes when one of its alternatives is here, so crates dual-licensed
# MIT or Apache-2.0 alongside something else need nothing more.
allow = [
    "MIT",
    "Apache-2.0",
    # Permissive, attribution only: subtle and others (BSD-3-Clause); ring,
    # rustls-webpki, untrusted, libloading (ISC); foldhash (Zlib).
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # The Unicode data license, permissive: the ICU crates under url and idna,
    # and unicode-ident's tables.
    "Unicode-3.0",
    # Apache-2.0 with an exception that only loosens it: target-lexicon, a
    # build-time dependency of the Linux GTK crates' build scripts.
    "Apache-2.0 WITH LLVM-exception",
    # The Mozilla CA bundle as data, a permissive data license: webpki-root-certs,
    # the trust roots rustls-platform-verifier (under reqwest) takes on a target
    # with no trust store of its own (WebAssembly), which the tree counts too.
    "CDLA-Permissive-2.0",
    # Weak copyleft per file: option-ext (under dirs).
    # It binds only those crates' own files, used unmodified and published on
    # crates.io, and allows distribution in a larger work under other terms.
    "MPL-2.0",
    # Permissive, attribution only or not even that, all through the native
    # window's GPUI snapshot: arrayref (BSD-2-Clause, under tiny-skia and
    # resvg); enum-iterator and enum-iterator-derive (0BSD, under
    # gpui-component); notify 8.2 (CC0-1.0, under gpui-component).
    "BSD-2-Clause",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
# Report duplicate versions so upstream dependencies can be reviewed together.
# Refuse wildcard requirements.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only: no other registry and no git dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
