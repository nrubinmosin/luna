[package]
name = "luna"
version = "0.4.0"
description = "Thin desktop UI over Claude Code and Codex CLI sessions"
edition = "2021"

[lib]
name = "luna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
portable-pty = "0.9"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
toml_edit = "0.22"
flate2 = "1"
tar = "0.4"
# The loopback listener the sessions' hooks post to (src/hub.rs): a few
# requests a minute, answered in microseconds — a blocking server on one
# thread, no async runtime.
tiny_http = "0.12"

# Subclassing the windows — the Alt menu and WM_ENDSESSION (src/sysmenu.rs);
# Job Objects and process counters for what a session has running under it
# (src/procs.rs); power requests and suspend for keep-awake and
# shutdown-when-done (src/power.rs). Pinned to the version tauri already
# resolves, so this adds features to a crate in the tree rather than a second
# copy of it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
