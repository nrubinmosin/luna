[package]
name = "luna"
version = "0.10.2"
description = "Thin desktop UI over Claude Code and Codex CLI sessions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nrubinmosin/luna"
edition = "2021"
# The toolchain in rust-toolchain.toml, the only one the crate is built with.
rust-version = "1.99.1"

[lib]
name = "luna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The core fingerprint (build.rs); already in the tree as a dependency.
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: a settings file Luna edits keeps its keys where the user put them.
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "7"
portable-pty = "0.9"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
# RSA verification of the Claude Code release manifest's signature
# (src/claude/manifest_sig.rs). The version rustls already brings in.
ring = "0.17.14"
# The secrets Luna mints (src/secret.rs), from the OS's CSPRNG. The version
# the tree already resolves.
getrandom = "0.4.3"
# Compares a presented secret with Luna's in constant time (src/secret.rs).
subtle = "2.6.1"
# Each chat's hook secret, HMAC-SHA256 of its id (src/secret.rs, hub.rs).
# Pinned exactly; it builds on the digest, sha2 and subtle already in the tree.
hmac = "=0.12.1"
# The hub's request heads (src/hub.rs), parsed strictly.
httparse = "1.10.1"
toml_edit = "0.25"
# Lays out a config.toml edited by hand, comments kept (account_settings/editor.rs).
taplo = { version = "0.14", default-features = false }
flate2 = "1"
tar = "0.4"
# A terminal emulator in memory, for showing an agent what its helper's
# screen says (src/pty/screen.rs `screen`): the scrollback replayed into a grid.
vt100 = "0.18"

# Subclassing the windows — the Alt menu and WM_ENDSESSION (src/sysmenu.rs);
# Job Objects and process counters for what a session has running under it
# (src/procs/win.rs); power requests, suspend, the shutdown call with the
# privilege it takes and the signs of what became of it (the session metric,
# the System log), for keep-awake and shutdown-when-done
# (src/power/machine.rs); the exit watcher's wait, exit code and
# boot time (src/lifecycle.rs); the DACLs on the folders holding secrets
# and on the private files made with one (src/secret.rs); the process at the
# other end of a loopback connection to the core, and its token (src/peer.rs);
# the core started with the desktop user's token and profile environment from
# a window run as administrator (src/elevation.rs). Pinned to the version tauri already
# resolves, so this adds features to a crate in the tree rather than a second
# copy of it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_EventLog",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The tie to the core off Windows: signals, and a look at every process
# (src/keeper/). Already in the tree through most of the above.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tauri's mock runtime, for the tests that hold the window's commands to its
# capability (lib.rs `acl`, not built on Windows). A feature of the tauri
# already in the tree.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Checked by `cargo clippy --all-targets -- -D warnings` on both Linux and
# Windows, the latter for the code only Windows compiles.
[lints.rust]
# Each unsafe call inside an `unsafe fn` gets a block of its own, as edition
# 2024 asks; the crate is still on 2021, where it is allowed by default.
unsafe_op_in_unsafe_fn = "warn"
# A path spelled out in full where the name is already in scope reads as if it
# meant some other item.
unused_qualifications = "warn"

[lints.clippy]
# The default set (correctness, suspicious, style, complexity, perf). Priority
# below the single lints so that those can override it.
all = { level = "warn", priority = -1 }
# The code types a tuple or a map of them where it is used (a lock's contents,
# a partition's two halves); an alias for each would put the shape a jump away
# from the one place that reads it.
type_complexity = "allow"
# Debug output and placeholders belong in a working copy, never in a commit.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
