[package]
name = "luna"
version = "0.21.0"
description = "Thin desktop UI over Claude Code and Codex CLI sessions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nrubinmosin/luna"
edition = "2021"
# The toolchain in rust-toolchain.toml, the only one the crate is built with.
rust-version = "1.100.0"

# The exe (src/main.rs) and the fuzz targets (fuzz/) link it.
[lib]
name = "luna_lib"
crate-type = ["rlib"]

[build-dependencies]
# The core fingerprint (build.rs), on the sha2 the exe links (below).
sha2 = "0.10"
# The Windows exe's icon and version resource (build.rs), compiled with the
# toolchain's llvm-rc: the crate and version gpui-pre's build script already
# embeds its manifest with.
embed-resource = "3"
# The Visual C++ runtime linked statically and the Universal CRT
# dynamically, as tauri-build linked 0.19's exe (build.rs). The version the
# tree resolved through it.
static_vcruntime = "3"

[dependencies]
base64 = "0.23"
jiff = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: a settings file Luna edits keeps its keys where the user put them.
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "7"
portable-pty = "0.9"
# Luna's own requests (src/http.rs) and the updater's: rustls on ring with
# the OS's trust store, so the tree holds one HTTP stack and one TLS stack.
# gzip decodes through the flate2 below.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "gzip"] }
# Luna's own async runtime (src/runtime.rs), which reqwest's futures and the
# blocking work run on: a multi-thread one with the I/O and time drivers
# reqwest needs. The version the tree already resolves through reqwest.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# SHA-256 throughout (downloads, tokens, file names, the HMAC). 0.10, on the
# digest stack hmac (below) builds on; it moves with hmac.
sha2 = "0.10"
# RSA verification of the Claude Code release manifest's signature
# (src/claude/manifest_sig.rs). The version rustls already brings in.
ring = "0.17.14"
# The secrets Luna mints (src/secret.rs), from the OS's CSPRNG. The version
# the tree already resolves.
getrandom = "0.4.3"
# Compares a presented secret with Luna's in constant time (src/secret.rs).
subtle = "2.6.1"
# Each chat's hook secret, HMAC-SHA256 of its id (src/secret.rs, hub.rs).
# Pinned exactly; it builds on the digest, sha2 and subtle the exe already links.
hmac = "=0.12.1"
# The hub's request heads (src/hub.rs), parsed strictly.
httparse = "1.10.1"
toml_edit = "0.25"
flate2 = "1"
tar = "0.4"
# A terminal emulator in memory, for showing an agent what its helper's
# screen says (src/pty/screen.rs `screen`): the scrollback replayed into a grid.
vt100 = "0.18"
# The native window (crates/window), which src/native.rs hosts: its calls'
# answers go back on a futures oneshot, and its and gpui's warnings come
# through the `log` facade (renamed: `log` is Luna's own module). Both already
# in the tree.
# A version as well as the path: cargo-deny refuses a requirement without one.
luna-window = { version = "0.1.0", path = "crates/window" }
futures = "0.3"
log-facade = { package = "log", version = "0.4" }

# The desktop services the window uses (src/desktop/): each the crate
# Tauri's plugin for it was built on, at the version 0.19 linked.
# The tray icon and its menu (desktop/tray.rs).
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"] }
# The folder and file pickers (desktop/dialog.rs): no message boxes, so no
# common controls v6 asked for here.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
# The parent window a picker is modal to; rfd's own trait version.
raw-window-handle = "0.6"
# The updater's signature check (desktop/updater.rs), minisign as 0.19's
# updater checked it, and its version compare.
minisign-verify = "0.3"
semver = "1"
# The tray icon decoded (desktop/tray.rs). The version tray-icon and muda
# link.
png = "0.18"
# The one import of 0.19's chat list (native/import.rs): a copy of the
# WebView's Local Storage, which Chromium keeps in LevelDB, read in pure Rust.
rusty-leveldb = "3"

# Subclassing the windows — the Alt menu and WM_ENDSESSION (src/sysmenu.rs);
# Job Objects and process counters for what a session has running under it
# (src/procs/win.rs); power requests, suspend, the shutdown call with the
# privilege it takes and the signs of what became of it (the session metric,
# the System log), for keep-awake and shutdown-when-done
# (src/power/machine.rs); the exit watcher's wait, exit code and
# boot time (src/lifecycle.rs); the DACLs on the folders holding secrets
# and on the private files made with one (src/secret.rs); the core's named
# pipe, overlapped, and the token its client opened it with (src/endpoint/,
# src/peer/); the core started with the desktop user's token and profile
# environment from a window run as administrator (src/elevation.rs); the
# local wall clock Codex names its rollouts by (src/codex/session/rollouts.rs);
# the clipboard, its global memory and the ANSI code page a file list may
# come in (src/desktop/clipboard.rs); the second launch's hand-over, a
# message-only window and WM_COPYDATA (src/desktop/single.rs); the installer
# started by the updater (src/desktop/updater.rs).
# Pinned to the version gpui's Windows crates link, so this adds features to
# a crate in the tree rather than a second copy of it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    # NtCreateFile, for the updater's folder and file made relative to a
    # handle on the folder above (desktop/updater.rs `Stage`).
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    # CoTaskMemFree, for the known folder Codex's system config is found in
    # (src/codex/config.rs `program_data`).
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows toasts (desktop/notify.rs), on the crate notify-rust shows them
# with: its own activation callback, with no thread left waiting on each
# toast.
tauri-winrt-notification = "0.8"

# The tie to the core off Windows: signals, and a look at every process
# (src/keeper/). Already in the tree through most of the above.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Notifications off Windows (desktop/notify.rs).
[target.'cfg(not(windows))'.dependencies]
notify-rust = "4.18"

# The pasteboard on macOS (src/desktop/clipboard.rs): text, file URLs, and
# whether an image is there. The versions muda and rfd link there.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPasteboard",
    "NSPasteboardItem",
] }

# Checked by `cargo clippy --all-targets -- -D warnings` on both Linux and
# Windows, the latter for the code only Windows compiles.
[lints.rust]
# Each unsafe call inside an `unsafe fn` gets a block of its own, as edition
# 2024 asks; the crate is still on 2021, where it is allowed by default.
unsafe_op_in_unsafe_fn = "warn"
# A path spelled out in full where the name is already in scope reads as if it
# meant some other item.
unused_qualifications = "warn"

[lints.clippy]
# The default set (correctness, suspicious, style, complexity, perf). Priority
# below the single lints so that those can override it.
all = { level = "warn", priority = -1 }
# The code types a tuple or a map of them where it is used (a lock's contents,
# a partition's two halves); an alias for each would put the shape a jump away
# from the one place that reads it.
type_complexity = "allow"
# Debug output and placeholders belong in a working copy, never in a commit.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The native window's screenshot harness (scripts/gpui-shots.ps1): optimized
# as the release is, built in a fraction of its time.
[profile.shots]
inherits = "release"
lto = false
codegen-units = 16

# The app and its native window, on one lockfile (Cargo.lock here). The
# vendored crates are patches, not members.
[workspace]
members = [".", "crates/window"]
exclude = ["vendor"]
resolver = "2"

# GPUI's Windows platform crate with Luna's patches (vendor/PATCHES.md).
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
