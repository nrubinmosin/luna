[package]
name = "luna-updater-signer"
version = "0.1.0"
description = "Signs Luna's release installers for the updater, in the form Tauri's signer gave them, and checks them as installed copies do"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nrubinmosin/luna"
edition = "2024"
rust-version = "1.100.0"
publish = false

[lib]
name = "luna_updater_signer"

[[bin]]
name = "luna-updater-signer"
path = "src/main.rs"

[dependencies]
# Keys and signatures: the crate, at the version, the Tauri CLI 2.12.5 that
# signed every release up to 0.19 is built on (`tauri signer`), so a key it
# wrote reads here and a signature made here is the one it made. Pinned
# exactly: the key's encryption and the signature's form are this crate's.
minisign = "=0.10.0"
# The check, on the crate installed copies check with: 0.19's
# tauri-plugin-updater and 0.20's desktop/updater.rs alike.
minisign-verify = "0.3"
base64 = "0.23"

[dev-dependencies]
# How 0.19's tauri-plugin-updater compares the signed version (lib.rs tests).
semver = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
