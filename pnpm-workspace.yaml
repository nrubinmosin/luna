# pnpm's settings for the repo: pnpm reads none from package.json since 11.
allowBuilds:
  # Its install script only checks the platform binary it already ships. Vite
  # installs it as an optional peer it does not use to build, and pnpm
  # refuses an install that leaves a package's build scripts undecided.
  esbuild: false

patchedDependencies:
  # A backport of xterm.js's fix after 6.0.0 (`pageLayoutVersion` in
  # addons/addon-webgl): in 0.19.0 an atlas page merge sets a flag on the
  # texture atlas, shared by every terminal of one font and theme, that is
  # never cleared, so every render from then on rebuilds the whole viewport.
  # The patch makes it a version each renderer rebuilds for once. Drop it with
  # the first addon release that has the fix (docs/architecture/frontend.md).
  "@xterm/addon-webgl@0.19.0": patches/@xterm__addon-webgl@0.19.0.patch
