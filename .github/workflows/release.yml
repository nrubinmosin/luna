# Releases from a v* tag on GitHub's runners: verified, built and signed,
# attested, and drafted as a GitHub Release for the maintainer to publish.
# scripts/release.ps1 makes the tag; docs/releasing.md walks through the flow,
# the secrets and environment it needs, and how to check what it published.
#
#   verify ─┬─ build ── sign (the signing key, in the `release` environment) ─┬─ attest ── publish (draft)
#           └─ sbom ─────────────────────────────────────────────────────────┘
#
# The build runs every dependency's build code and holds no secret; the key
# reaches only the sign job, which runs none of it.
#
# A manual run is a dry run unless told otherwise: everything short of the
# attestations and the release. Off a tag it signs, as the release would; off
# a branch it leaves the installer unsigned, as the key is only ever handed to
# a v* tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and check only; attest and publish nothing
        type: boolean
        default: true

# Each job asks for what it uses.
permissions: {}

# One run per tag (or branch) at a time, and none canceled halfway: a release
# stopped between its attestations and its draft would leave half a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  # The version files agree with each other and with the tag, the tag is
  # annotated and on the default branch, and CI has passed on the commit
  # (scripts/release-verify.ps1). Nothing is built, and no secret is in
  # reach, until this has passed.
  verify:
    runs-on: ubuntu-24.04
    # Mostly waiting for CI, when the tag was pushed with its commit.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the runs of ci.yml on the commit
    outputs:
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
      signed: ${{ steps.verify.outputs.signed }}
      publish: ${{ steps.verify.outputs.publish }}
      previous: ${{ steps.verify.outputs.previous }} # the latest published release, the notes' baseline
      notes: ${{ steps.verify.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: >-
          ./scripts/release-verify.ps1 -Ref $env:GITHUB_REF -Sha $env:GITHUB_SHA
          -Repo $env:GITHUB_REPOSITORY -DefaultBranch $env:DEFAULT_BRANCH
          -DryRun:($env:DRY_RUN -eq 'true')

  # The installer and latest.json, built by the same script and Docker image as
  # on the maintainer's machine, unsigned: `tauri build` runs every
  # dependency's build scripts, proc-macros and frontend tooling, so this job
  # gets no secret and no environment, and signs nothing.
  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the installer
        run: ./scripts/build-windows.ps1 -Installer
      - name: Gather the installer and latest.json
        env:
          NOTES: ${{ needs.verify.outputs.notes }}
        run: ./scripts/release-bundle.ps1 -Out "$env:RUNNER_TEMP/unsigned" -Notes $env:NOTES
      # What sign has to find in the artifact, handed over as a job output,
      # which no later job can change.
      - id: sums
        shell: bash
        working-directory: ${{ runner.temp }}/unsigned
        env:
          LC_ALL: C
        run: |
          delimiter="sums-$(openssl rand -hex 16)"
          { echo "sums<<$delimiter"; sha256sum -- *; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          sha256sum -- *
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
          retention-days: 7

  # The installer's updater signature, and latest.json carrying it. The signing
  # key is a secret of the `release` environment alone, which hands it to v*
  # tags only and only once a reviewer has approved the run: the one approval
  # of a release, given with the build done. A dry run off a branch names no
  # environment, gets no key and passes the bundle on unsigned.
  #
  # Nothing of the build's runs here. The checkout holds only the files the
  # signing reads, so no package manifest, lockfile hook or build script is
  # even on disk; release-sign.ps1 fetches the Tauri CLI's Linux build, checks
  # it against the integrity pnpm-lock.yaml pins (the bytes the build's pnpm
  # install checked), and signs in the pinned Node image with no network. The
  # bundle is checked against the build's checksums first.
  sign:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.verify.outputs.signed == 'true' && 'release' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/lib.ps1
            /scripts/release-lib.ps1
            /scripts/release-sign.ps1
            /scripts/updater-signature.mjs
            /docker/windows-build.Dockerfile
            /pnpm-lock.yaml
            /src-tauri/tauri.conf.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/assets
      - name: Check the bundle against the build's checksums
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          . ./scripts/lib.ps1
          . ./scripts/release-lib.ps1
          Assert-AssetChecksums "$env:RUNNER_TEMP/assets" $env:SUMS
      # The key goes to this step alone, and from it only into the signer's
      # container.
      - name: Sign the installer
        if: needs.verify.outputs.signed == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release-sign.ps1 -Dir "$env:RUNNER_TEMP/assets" -Version $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 7

  # CycloneDX SBOMs of the crates and the npm packages that go into the build.
  sbom:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/sbom.ps1 -Out "$env:RUNNER_TEMP/sbom"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 7

  # SHA256SUMS over every asset, and for a release, a build provenance
  # attestation of each and the SBOMs attested against the installer, signed
  # through Sigstore with this run's identity. A job of its own, so the build,
  # which runs every dependency's build code, never holds the OIDC token.
  # actions/attest with sbom-path is what actions/attest-sbom wrapped before it
  # was deprecated; sbom.ps1 has already checked each SBOM is one it takes.
  attest:
    needs: [verify, sign, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the Sigstore certificate for this run's identity
      attestations: write # to keep the attestations with the repo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: assets
      - name: SHA256SUMS
        shell: bash
        working-directory: assets
        env:
          LC_ALL: C
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      # Dry runs attest nothing: an attestation is a lasting public record of
      # a build, and theirs are never published.
      - if: needs.verify.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - if: needs.verify.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*-setup.exe
          sbom-path: assets/luna-${{ needs.verify.outputs.version }}-cargo.cdx.json
      - if: needs.verify.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*-setup.exe
          sbom-path: assets/luna-${{ needs.verify.outputs.version }}-npm.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.verify.outputs.tag }}
          path: assets/
          if-no-files-found: error
          retention-days: 14

  # A draft, not a release: installed copies poll the latest published
  # release's latest.json, so nothing reaches them until the maintainer has
  # looked the draft over and published it. Its notes come from CHANGELOG.md
  # (scripts/release-notes.ps1): the version's section, the sections of every
  # version newer than the latest published release as verify found it, and
  # the checksums with the commands to verify the assets.
  publish:
    needs: [verify, attest]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # For CHANGELOG.md and the scripts the notes are made with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.verify.outputs.tag }}
          path: ${{ runner.temp }}/assets
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PREVIOUS: ${{ needs.verify.outputs.previous }}
        run: |
          # Drafts show only to a token that can push, as this one can: a
          # release of the tag, a draft left by an earlier run included, is
          # deleted by hand or kept, never replaced here.
          $existing = gh api --paginate "repos/$env:GH_REPO/releases" --jq '.[] | select(.tag_name == $ENV.TAG) | .html_url'
          if ($LASTEXITCODE) { throw "listing the releases failed (exit $LASTEXITCODE)" }
          if ($existing) { throw "$env:TAG already has a release: $existing" }
          ./scripts/release-notes.ps1 -Previous $env:PREVIOUS -Checksums "$env:RUNNER_TEMP/assets/SHA256SUMS" -Out "$env:RUNNER_TEMP/notes.md"
          $assets = (Get-ChildItem "$env:RUNNER_TEMP/assets" -File).FullName
          gh release create $env:TAG @assets --draft --verify-tag --title "Luna $env:VERSION" --notes-file "$env:RUNNER_TEMP/notes.md"
          if ($LASTEXITCODE) { throw "gh release create failed (exit $LASTEXITCODE)" }
