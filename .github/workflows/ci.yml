# The gate (scripts/gate.ps1), one group per job, plus the Windows unit tests,
# which are cross-built on Linux and run on a Windows runner. Every job runs the
# same scripts and Docker images as a local check, on the toolchains pinned in
# the repo (src-tauri/rust-toolchain.toml, .node-version, docker/).
name: CI

# Branch pushes give feedback without opening a PR; master and pull requests
# are the gate. A PR and its branch push may both run, each in its own group.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes its running checks moot; on master every
# commit (and every branch push or manual run) keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the commit-message check walks the pushed range
      - run: ./scripts/gate.ps1 -Group frontend
      # Only the commits this push or PR brings, so history from before the rules
      # does not fail it: a PR from its base, a push from its old tip, a new
      # branch from master. Off master, what master already holds is left out
      # too: a branch that merged master in, or was force-pushed over its own
      # merge, has master's commits in its before..after. An old tip the clone
      # lacks (a force-push) is fetched; one that is gone fails the run, since
      # a range from the new tip itself would check nothing and pass.
      - name: Commit messages follow the rules
        shell: sh
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sh scripts/check-commit-msg.test.sh
          if [ -n "$BASE" ]; then
            from=$BASE
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            from=origin/master
          else
            from=$BEFORE
          fi
          git cat-file -e "$from^{commit}" 2>/dev/null || git fetch -q origin "$from" 2>/dev/null || true
          if ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            echo "commit-message check: the range's start $from is not in this clone (a force-push?), so the pushed commits cannot be told from history; fix the range by hand (sh scripts/check-commit-msg.sh --range A..B) rather than let this run check nothing" >&2
            exit 1
          fi
          not=
          [ "$GITHUB_REF" = refs/heads/master ] || not=^origin/master
          sh scripts/check-commit-msg.sh --range "$from..$HEAD" $not

  # The Linux image (docker/linux-check.Dockerfile) rather than a setup action:
  # one definition of the toolchain and the system libraries for the local gate
  # and for CI, so a failure here reproduces with the same command at home.
  rust-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/gate.ps1 -Group rust

  # Clippy over the Windows-only code, and the unit tests built as Windows
  # executables; cargo's JSON names the exact files (scripts/windows-tests.ps1).
  # Then the third-party notices the installer and the release carry, made as
  # the release makes them: on a Linux host, as a user that is not root, which
  # reads what root's containers hand back, as Docker on Windows never shows.
  windows-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/gate.ps1 -Group windows
      - run: ./scripts/windows-tests.ps1 -Build
      - run: ./scripts/third-party-notices.ps1 -Out "$env:RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests
          path: test-build/windows-tests/
          if-no-files-found: error
          retention-days: 3

  windows-tests:
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      # For the script alone: the executables run from a folder of their own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-tests
          path: ${{ runner.temp }}/windows-tests
      - run: ./scripts/windows-tests.ps1 -Run -Dir "$env:RUNNER_TEMP/windows-tests"
