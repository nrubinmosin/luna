# The fuzz targets (src-tauri/fuzz, scripts/fuzz.ps1) for a few minutes each,
# weekly and by hand: too slow for every push, and what they find is a new
# input rather than a regression a change made. Each run starts from the seed
# fixtures; only what it finds (a crash, a timeout, an out-of-memory input) is
# kept, as an artifact, to reproduce with `scripts/fuzz.ps1 -Reproduce`.
name: Fuzz

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '300'

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [claude_transcript, codex_rollout]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: ./scripts/fuzz.ps1 -Target $env:TARGET -Seconds $env:SECONDS_PER_TARGET
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-findings
          path: test-build/fuzz/${{ matrix.target }}/artifacts/
          if-no-files-found: ignore
          retention-days: 30
