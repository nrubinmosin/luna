# Monthly, one pull request per ecosystem: each goes through the whole gate in
# CI. Monthly rather than weekly, as every grouped PR costs a full gate run and
# a review, and nothing here needs to move faster. A security advisory still
# opens its own PR at once, outside the schedule: every ignore below is by
# update type, and Dependabot sets those aside for a security update (an
# explicit `versions` range would hold for those too).
#
# Toolchains stay on their major version. The FROM lines in docker/ name each
# image by tag and digest, and Dependabot moves both, a rebuilt tag included;
# but a new Node or Rust major is a migration, decided by hand, not a monthly
# bump (an image major alone also fails the gate's pin check, Assert-ToolchainPins
# in scripts/lib.ps1). The pins that go with the images are not Dependabot's to
# move: .node-version, src-tauri/rust-toolchain.toml and rust-version in
# src-tauri/Cargo.toml, and cargo-xwin, installed by version in
# docker/windows-build.Dockerfile. So a minor or patch image bump still arrives
# as a PR and fails the pin check, which names the file to bump with it; that
# PR is the reminder. Rust has no next major in sight, so its 1.x releases keep
# coming that way; the ignore is there for symmetry with Node.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
    # Each of these is a migration the crate's code has to follow by hand; a
    # monthly PR would fail to compile until then. For cargo Dependabot counts
    # a 0.y -> 0.(y+1) bump as major, the way cargo does, so semver-major
    # covers sha2 0.11 and hmac 0.13 as well as ureq 3. Lift an entry when the
    # migration is done.
    ignore:
      # ureq 3 reworked the whole API (builder, errors, responses) in five
      # modules and the hub's tests.
      - dependency-name: ureq
        update-types: ['version-update:semver-major']
      # sha2 0.11 and hmac 0.13 build on digest 0.11, a second digest stack
      # beside the 0.10 one tauri's tree still carries; the manifest pins them
      # to what the tree already resolves. Move them when tauri does.
      - dependency-name: sha2
        update-types: ['version-update:semver-major']
      - dependency-name: hmac
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ['*']
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: rust
        update-types: ['version-update:semver-major']
